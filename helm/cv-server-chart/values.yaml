# Generic defaults. The real GKE settings live in values.gke.yaml, which is the
# ONLY values file CI and the guarded manual deploy use (see docs/RUNBOOK-gke.md).
replicaCount: 2

image:
  repository: ""
  # Required. Must be a full 40-char commit SHA (enforced by values.schema.json):
  # a mutable tag such as "latest" cannot be traced back to one build.
  tag: ""
  pullPolicy: IfNotPresent

service:
  # ClusterIP: traffic enters through the ingress only (TLS at the edge).
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecretName: ""
  annotations: {}

serviceAccount:
  # Dedicated identity for the pod. It has no GCP binding and no Kubernetes API
  # token: the app talks to Neon, Notion and the LLMs, never to the cluster.
  name: cv-server

secrets:
  # When set, the pod loads EVERY variable from this Secret (envFrom) and
  # ignores existingSecret/keys.
  envFromSecret: ""
  existingSecret: cv-secrets
  keys:
    claudeApiKey: claude-api-key
    groqApiKey: groq-api-key
    notionToken: notion-token
    # Optional: the pod starts without it (optional: true).
    databaseUrl: database-url

rollout:
  # Surge first: the new pod must be Ready before an old one goes away.
  maxSurge: 1
  maxUnavailable: 0

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpread:
  enabled: true
  # ScheduleAnyway: prefer one pod per node, but never leave a pod Pending for it.
  whenUnsatisfiable: ScheduleAnyway

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

helmTest:
  enabled: true
