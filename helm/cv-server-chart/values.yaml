replicaCount: 2

image:
  repository: tu-registry/cv-server
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80

# Las claves NUNCA van en values.yaml: Helm guarda los values en el historial
# del release. Se leen de un Secret ya existente en el cluster.
# Crear con:
#   kubectl create secret generic cv-secrets \
#     --from-literal=claude-api-key=... \
#     --from-literal=groq-api-key=... \
#     --from-literal=notion-token=...
secrets:
  # When set, the pod loads EVERY variable from this Secret (envFrom) and
  # ignores existingSecret/keys. Create it with:
  #   kubectl create secret generic cv-env --from-env-file=<path to .env>
  envFromSecret: ""
  existingSecret: cv-secrets
  keys:
    claudeApiKey: claude-api-key
    groqApiKey: groq-api-key
    notionToken: notion-token
    # Opcional: si no existe la clave, el pod arranca igual (optional: true).
    databaseUrl: database-url

rollout:
  maxSurge: 0
  maxUnavailable: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
