{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
# Secret Manager -> Kubernetes Secret, via External Secrets Operator (ADR-014).
# The values never pass through Helm, git or CI: only the secret NAME is here.
#
# Identity chain (Workload Identity, no keys):
#   ESO requests a token for KSA {{ $es.readerServiceAccount.name }}
#   -> GKE exchanges it for GSA {{ $es.readerServiceAccount.gcpServiceAccount }}
#   -> that GSA can only access the one secret {{ $es.remoteKey }} (Terraform).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $es.readerServiceAccount.name }}
  labels:
    {{- include "cv-server.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "externalSecrets.readerServiceAccount.gcpServiceAccount is required" $es.readerServiceAccount.gcpServiceAccount }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}-gcp-secret-manager
  labels:
    {{- include "cv-server.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ required "externalSecrets.projectID is required" $es.projectID }}
      auth:
        workloadIdentity:
          clusterLocation: {{ required "externalSecrets.clusterLocation is required" $es.clusterLocation }}
          clusterName: {{ required "externalSecrets.clusterName is required" $es.clusterName }}
          serviceAccountRef:
            name: {{ $es.readerServiceAccount.name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-env
  labels:
    {{- include "cv-server.labels" . | nindent 4 }}
spec:
  # Pods read env only at start: after a rotation, `kubectl rollout restart`.
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Release.Name }}-gcp-secret-manager
  target:
    name: {{ $es.targetSecret }}
    creationPolicy: Owner
    # Uninstalling the release must not delete the env the pods need.
    deletionPolicy: Retain
  # One JSON object in Secret Manager; each top-level key becomes one variable.
  dataFrom:
  - extract:
      key: {{ $es.remoteKey }}
      version: latest
{{- end }}
