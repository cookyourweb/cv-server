apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cv-server
  labels:
    app: cv-server
    app.kubernetes.io/name: cv-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: cv-server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
