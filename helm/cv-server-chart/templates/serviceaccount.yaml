# The pod's own identity instead of the namespace "default" account. It gets no
# Kubernetes API token and no GCP binding: least privilege for an app that only
# calls external APIs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "cv-server.labels" . | nindent 4 }}
automountServiceAccountToken: false
