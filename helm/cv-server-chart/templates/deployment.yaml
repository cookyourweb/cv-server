apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cv-server.fullname" . }}
  labels:
    {{- include "cv-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # With the HPA on, the HPA owns the replica count: setting it here would reset
  # the scale on every upgrade.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollout.maxSurge }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "cv-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cv-server.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "cv-server.podSecurityContext" . | nindent 8 }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
        labelSelector:
          matchLabels:
            {{- include "cv-server.selectorLabels" . | nindent 12 }}
      {{- end }}
      containers:
      - name: cv-server
        image: {{ include "cv-server.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8000
          name: http
        {{- if .Values.secrets.envFromSecret }}
        # All production config comes from one Secret. No explicit env here: an
        # explicit env entry would win over envFrom and hide the real values.
        envFrom:
        - secretRef:
            name: {{ .Values.secrets.envFromSecret }}
        {{- else }}
        env:
        - name: CLAUDE_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret }}
              key: {{ .Values.secrets.keys.claudeApiKey }}
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret }}
              key: {{ .Values.secrets.keys.groqApiKey }}
        - name: NOTION_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret }}
              key: {{ .Values.secrets.keys.notionToken }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret }}
              key: {{ .Values.secrets.keys.databaseUrl }}
              # Without DATABASE_URL the service still works (no-database mode).
              optional: true
        {{- end }}
        securityContext:
          {{- include "cv-server.containerSecurityContext" . | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
