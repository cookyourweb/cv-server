# Pod Security Admission labels. `restricted` = non-root, no privilege
# escalation, all capabilities dropped, seccomp RuntimeDefault. A pod that
# breaks it is REJECTED at admission, not just reported.
#
# Apply only after the server-side dry run in docs/RUNBOOK-gke.md (phase 4)
# reports no warnings for the pods already running there.
apiVersion: v1
kind: Namespace
metadata:
  name: default # cv-server lives here (moving it is a listed next step)
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
