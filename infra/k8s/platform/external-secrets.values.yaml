# External Secrets Operator, release `external-secrets` in namespace
# `external-secrets` (ADR-014). The chart defaults already meet the
# "restricted" Pod Security Standard (non-root, seccomp, no capabilities).
installCRDs: true

# Requests sized for one SecretStore and one ExternalSecret, so the scheduler
# reserves real room for them (the chart default reserves nothing).
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
